<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A6192E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skull Creek Station Shutdown</title>
<style>
  :root{ --red:#A6192E; --dark:#1A1A1A; --gray:#666; --light:#F2F2F2; --line:#999; --pink:#E0457B; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{font-family:Arial, Helvetica, sans-serif; margin:0; background:#fff; color:#000; padding-bottom:90px;}
  .wrap{max-width:880px; margin:0 auto; padding:12px 14px;}
  .topline{display:flex; justify-content:space-between; font-size:12px; font-weight:bold; padding:6px 2px; color:var(--red);}
  .topline span:last-child{color:var(--gray); font-weight:normal;}
  .redbar{background:var(--red); color:#fff; font-weight:900; font-size:clamp(19px,4.5vw,26px);
          letter-spacing:.5px; padding:12px 16px; text-transform:uppercase;}
  .darkbar{background:var(--dark); color:#fff; font-weight:bold; font-size:14px; letter-spacing:.5px;
           padding:8px 14px; text-transform:uppercase; margin-top:18px; display:flex; justify-content:space-between; gap:10px;}
  .darkbar .prog{font-weight:normal; opacity:.85; white-space:nowrap;}
  .meta{display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin:14px 0 4px;}
  .meta label{display:block; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px;}
  .meta input{width:100%; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:0; font-family:inherit;}

  .tabs{display:flex; gap:0; margin-top:12px; border-bottom:3px solid var(--red);}
  .tab{flex:1; padding:11px 4px; font-size:14px; font-weight:bold; text-align:center; background:var(--light);
       border:1px solid var(--line); border-bottom:none; cursor:pointer; color:var(--dark); font-family:inherit;}
  .tab.on{background:var(--red); color:#fff; border-color:var(--red);}
  .panel{display:none;} .panel.on{display:block;}

  .sec-note{font-size:12px; color:var(--gray); font-style:italic; margin:6px 2px 0;}
  .row{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line); border-top:none; cursor:pointer;}
  .row:nth-of-type(odd){background:var(--light);}
  .row input{width:24px; height:24px; accent-color:var(--red); flex:none; margin-top:1px;}
  .row .txt{font-size:15px; line-height:1.3;}
  .row .note{display:block; font-size:12.5px; color:var(--gray); font-style:italic; margin-top:3px;}
  .row.done .txt .main{text-decoration:line-through; color:#888;}
  .badge{display:inline-block; font-size:10px; font-weight:bold; letter-spacing:.4px; padding:2px 6px; margin-right:6px;
         color:#fff; vertical-align:middle; text-transform:uppercase;}
  .badge.stage{background:var(--pink);} .badge.today{background:var(--dark);}
  .from{font-size:11px; color:var(--gray); margin-left:4px;}
  .row .txt{flex:1; min-width:0;}
  .stamp{flex:none; min-width:42px; text-align:right; font-size:11.5px; line-height:1.25; font-weight:bold; color:var(--gray); white-space:nowrap;}
  .row.done .stamp{color:var(--red);}
  .who{display:flex; align-items:center; gap:10px; margin:10px 0 2px;}
  .who label{font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;}
  .who input{width:84px; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:0; font-family:inherit; text-transform:uppercase; text-align:center; letter-spacing:1px;}
  .who .sync{flex:1; text-align:right; font-size:11.5px; color:var(--gray);}
  .who .sync.bad{color:var(--red); font-weight:bold;}

  .wx{margin:12px 0 0; border:1px solid var(--line);}
  .wx-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; background:var(--dark); color:#fff; padding:8px 12px; font-size:12.5px; font-weight:bold; text-transform:uppercase; letter-spacing:.4px;}
  .wx-head span{font-weight:normal; text-transform:none; opacity:.8; font-size:11.5px; text-align:right;}
  .wx details summary{list-style:none; cursor:pointer;} .wx details summary::-webkit-details-marker{display:none;}
  .wx-alert summary{background:#FFF3CD; color:#5c3d00; font-weight:bold; padding:9px 12px; font-size:13.5px; border-top:1px solid var(--line);}
  .wx-alert.sev summary{background:var(--red); color:#fff;}
  .wx-alert .d{padding:8px 12px 10px; font-size:12.5px; line-height:1.4; white-space:pre-wrap; background:#fffaf0;}
  .wx-p summary{display:grid; grid-template-columns:86px 42px 38px 1fr; gap:6px; align-items:center; padding:8px 12px; font-size:13.5px; border-top:1px solid #ddd;}
  .wx-p .n{font-weight:bold;} .wx-p .t{font-weight:bold; color:var(--red);} .wx-p .r{color:var(--gray); font-size:12.5px;} .wx-p .s{line-height:1.25;}
  .wx-p .d{padding:0 12px 10px; font-size:13px; line-height:1.4; color:#333;}
  .wx-note{padding:6px 12px; font-size:11px; color:var(--gray); border-top:1px solid #ddd;}
  .wx-btn{margin:10px 12px; font-size:14px; font-weight:bold; padding:9px 12px; border:2px solid var(--red); background:#fff; color:var(--red); font-family:inherit; cursor:pointer;}
  .wx-msg{padding:10px 12px; font-size:13px; color:var(--gray);}
  .wx-rain{padding:9px 12px; font-size:13.5px; line-height:1.3; background:#EAF6EA; color:#1d5b1d; border-top:1px solid var(--line);}
  .wx-rain.hit{background:var(--red); color:#fff; font-weight:bold;}
  .wx-days{display:flex; border-top:1px solid #ddd;}
  .wx-days div{flex:1; text-align:center; padding:6px 2px; font-size:12px; border-right:1px solid #ddd; color:var(--gray);}
  .wx-days div:last-child{border-right:none;} .wx-days b{display:block; color:#000; font-size:11.5px;}
  .wx-days div.hit{background:#fde0e4; color:var(--red); font-weight:bold;}

  .actions{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--red);
           display:flex; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .actions button{flex:1; font-size:15px; font-weight:bold; padding:12px 6px; border:2px solid var(--red);
                  background:#fff; color:var(--red); font-family:inherit; cursor:pointer;}
  .actions button.primary{background:var(--red); color:#fff;}
  .foot{font-size:11.5px; color:var(--gray); margin:14px 2px;}
  @media print{
    .actions,.tabs,.wx,.who{display:none;} .panel{display:block !important;} body{padding:0;}
    .darkbar,.redbar,.badge{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .row{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline"><span>CAL FIRE &bull; TCU Battalion 4</span><span id="today"></span></div>
  <div class="redbar">Skull Creek Station Shutdown</div>
  <div class="meta">
    <div><label for="f-date">Date</label><input id="f-date" type="date"></div>
    <div><label for="f-crew">Crew / completed by</label><input id="f-crew" type="text" placeholder="Names or initials"></div>
  </div>
  <div class="who">
    <label for="f-who">Your initials</label>
    <input id="f-who" type="text" maxlength="4" placeholder="ABC" autocomplete="off" autocapitalize="characters">
    <span class="sync" id="sync">Connecting…</span>
  </div>
  <div class="wx" id="wx"></div>
  <div class="tabs">
    <button class="tab on" data-tab="today">Today</button>
    <button class="tab" data-tab="list">3-Day List</button>
    <button class="tab" data-tab="arnold">To Arnold</button>
  </div>
  <div id="panels"></div>
  <p class="foot">Checks are shared with the whole crew and stamped with the date and your initials. Tap <b>Save as PDF</b> to print the full list.</p>
</div>
<div class="actions">
  <button id="btn-reset">Reset all</button>
  <button id="btn-pdf" class="primary">Save as PDF</button>
</div>

<script>
/* ============================================================
   CONFIG — edit lists here. Item = [text, {stage, today, note}]
   stage:true  = marked pink on the paper list (can be staged early)
   today:true  = specifically called out for today
   ============================================================ */
const TODAY_LABEL = "Mon Oct 26";

const TODAY_ITEMS = [
  ["Fix the dryer"],
  ["Meat order calculation sheet"],
  ["Line all burn piles well so we can walk away"],
  ["Stack old firewood and line those piles well"],
  ["Chuy: grab a box of brown paper towels next trip in to Skull Creek Station"],
  ["Bring two white coolers from Arnold back to Skull Creek to stage for move-out"],
  ["Roll hose on drying rack when dry"],
  ["Set up the staging pile for Arnold", {note:"Start bringing things in to Arnold ahead of the big move-out. Everything marked pink can be staged now (listed below)."}]
];

const SECTIONS = [
 { id:"shed", tab:"list", title:"Day 1/2 — Store in shed", items:[
  ["Windsock — lower pole pivot to ground and leave in place"],
  ["Hose roller and hose rack items"],
  ["All garden hoses"],
  ["Horseshoes"],
  ["Wheelbarrows"]
 ]},
 { id:"misc", tab:"list", title:"Day 1/2 — Misc", items:[
  ["Put pantry dry goods that mice could get into in plastic totes and stage in pantry"],
  ["Stage/hang up shutters. Use designated shutter nuts in milk jug", {stage:true}],
  ["Move meat into Arnold, unplug and drain freezer, clean and dry, leave lid open so it doesn't mildew"],
  ["DC spring manifold, store in tool room, cover downstream pipe end with gloves and rubber bands (not downstream spring side, leave open for water to drain all winter)"],
  ["Drain non-potable pipe to tank on inlet side, leave cracked open"],
  ["Ridex toilets", {stage:true}],
  ["Do all laundry"],
  ["Move fridge items into Arnold/defrost, clean and dry fridges. Leave doors open with towels hung to not mildew fridges"],
  ["Cover mini split condenser unit with half culvert to protect from snow shed off roof", {stage:true, note:"The half culvert metal piece goes next to the AC condenser."}],
  ["Drain/clean ice machine, leave door cracked open. Remove filters."],
  ["Clean fireplace out", {stage:true}],
  ["Wipe out and clean out barrack lockers", {note:"Don't leave any personal items in lockers."}],
  ["Cover spigots with winter covers"],
  ["Empty crew mailboxes", {stage:true, note:"Don't leave any personal items in the mailboxes."}],
  ["Cover pantry vent holes", {stage:true}],
  ["DC wharf head Y and hydrant wrench, put in app bay. Cover wharf head with garbage can"],
  ["Cover bedding with fitted sheets so Ronnie-Rizats don't sleep on wool covers"]
 ]},
 { id:"appbay", tab:"list", title:"Day 3 — Store in app bay (day of leaving)", items:[
  ["Wooden E4454, table and beams, roll and put structure hose away"],
  ["Chalk block"],
  ["Mop bucket, brooms, squeegee"],
  ["Picnic tables"],
  ["Station sign"],
  ["Traeger, buckets and table"],
  ["Shut off outside speakers in office at base radio under PA"],
  ["Drain non-potable water tank downhill, leave spigots cracked"],
  ["Shut off potable well breaker so well pump doesn't continue to fill tank"],
  ["Drain potable tank at tank dump, drain lines down to barracks. Once the tank is empty close the drain valve."],
  ["Drain dishwasher basin"],
  ["Video/pic of pantry for open-up list. Pic of fuel and propane quantities off white board"],
  ["Collect month end sheets and dip tanks for final month ends"],
  ["Drain hot water heater, leave all valves open and hoses DC'd, ensuring drainage into a bucket"]
 ]},
 { id:"final", tab:"list", title:"Day 3 — Final shutdown & lock-up", items:[
  ["Open shower heads, leave open"],
  ["DC toilet water line, flush down tank water, pour antifreeze in residual bowl water"],
  ["Close all propane valves to all heaters and appliances throughout both buildings"],
  ["Lock hot water heater room"],
  ["Shut off main propane valves"],
  ["Lock doors and windows and put up last shutters"],
  ["Close/lock station gate"],
  ["Store impact/wrenches/WD-40 in generator room for shutters"],
  ["Take in trash"],
  ["Dump coffee maker grounds"],
  ["Move Starlink in"],
  ["Watch wifi system shut down video and shut TCU wifi down"],
  ["Put generator and Outback in manual mode"],
  ["DC generator battery / take to Arnold"],
  ["Flip Outback inverter breakers — 2 large side by side, 175 amp"]
 ]},
 { id:"arnold", tab:"arnold", title:"Take into Arnold", items:[
  ["Personnel files, month ends, etc. — place in purple tote"],
  ["Saw training files"],
  ["Laptop, charger"],
  ["IIPP binder and IIPP 2/3 binder"],
  ["ALL fire extinguishers", {stage:true, note:"Stage in a line against the wall in the app bay."}],
  ["Spare O2 bottles in back cabinet and med bag", {stage:true, note:"Check hydro dates first. If past five years, bring to Arnold; if not, leave at Skull Creek."}],
  ["Spare SCBA bottles (6)", {stage:true, note:"Check hydro dates first. If past five years, bring to Arnold; if not, leave at Skull Creek."}],
  ["Shorties for recoupling", {stage:true, note:"Crate of short hoses to be cut down and re-coupled at Arnold."}],
  ["395 for rebuild"],
  ["Generator battery"],
  ["Gas monitor MSA case for bump testing", {today:true, note:"Bring the gas monitor bump test kit to Arnold."}],
  ["Old diesel fuel pump for rebuilding", {stage:true}],
  ["Holmatro spare battery and charger", {stage:true}]
 ]}
];

/* ================= engine ================= */
const API = "/api/shutdown";
const K_META = "skullshut_meta", K_WHO = "skullshut_who", K_PEND = "skullshut_pending", K_CACHE = "skullshut_cache";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let meta = load(K_META, {}), who = load(K_WHO, ""), pending = load(K_PEND, {}), server = load(K_CACHE, {});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Item ids come from the item's text, so reordering or adding items never shifts who checked what. */
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
SECTIONS.forEach(s => s.items.forEach(it => { it.id = s.id + ":" + hash(it[0]); it.opt = it[1] || {}; it.sec = s.title.split("—").pop().trim(); }));
TODAY_ITEMS.forEach(it => { it.id = "today:" + hash(it[0]); it.opt = it[1] || {}; });

/* A check is whatever the server says, overlaid by this device's not-yet-synced taps. */
const stateOf = id => {
  const p = pending[id];
  if (p) return p.op === "check" ? { by: p.by, at: p.at } : null;
  return server[id] || null;
};
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate(); };
const stampHTML = st => st ? esc(fmtDay(st.at)) + "<br>" + esc(st.by || "") : "";

function rowHTML(it, showFrom){
  const o = it.opt, st = stateOf(it.id);
  const badges = (o.stage ? '<span class="badge stage">Stage early</span>' : '') + (o.today ? '<span class="badge today">Today</span>' : '');
  return `<label class="row${st?" done":""}" data-id="${it.id}">
    <input type="checkbox" data-id="${it.id}" ${st?"checked":""}>
    <span class="txt">${badges}<span class="main">${esc(it[0])}</span>${showFrom?`<span class="from">(${esc(it.sec)})</span>`:""}
    ${o.note?`<span class="note">${esc(o.note)}</span>`:""}</span><span class="stamp">${stampHTML(st)}</span></label>`;
}
function block(title, items, note, showFrom, pid){
  return `<div class="darkbar"><span>${esc(title)}</span><span class="prog" data-prog="${pid}"></span></div>
    ${note?`<div class="sec-note">${esc(note)}</div>`:""}${items.map(i => rowHTML(i, showFrom)).join("")}`;
}
const all = SECTIONS.flatMap(s => s.items);
const stageItems = all.filter(i => i.opt.stage);
const todayExtra = all.filter(i => i.opt.today && !i.opt.stage);

const groups = {}; // progress groups: pid -> item list
function build(){
  let html = "";
  groups.priorities = TODAY_ITEMS; groups.stage = stageItems; groups.extra = todayExtra;
  html += `<div class="panel on" id="p-today">` +
    block("Today — " + TODAY_LABEL, TODAY_ITEMS, "", false, "priorities") +
    block("Staging pile — pink items", stageItems, "Marked pink on the paper list. Fine to start staging before the move-out. Checking here also checks it on its own list.", true, "stage") +
    (todayExtra.length ? block("Also bring to Arnold", todayExtra, "", true, "extra") : "") + `</div>`;
  ["list","arnold"].forEach(t => {
    html += `<div class="panel" id="p-${t}">` + SECTIONS.filter(s => s.tab === t).map(s => { groups[s.id] = s.items; return block(s.title, s.items, "", false, s.id); }).join("") + `</div>`;
  });
  document.getElementById("panels").innerHTML = html;
  progress();
}
function progress(){
  document.querySelectorAll("[data-prog]").forEach(el => {
    const g = groups[el.dataset.prog] || [];
    el.textContent = g.filter(i => stateOf(i.id)).length + " / " + g.length;
  });
}
/* Repaint every row from current state (same item can appear on several tabs). */
function refresh(){
  document.querySelectorAll(".row[data-id]").forEach(r => {
    const st = stateOf(r.dataset.id);
    r.classList.toggle("done", !!st);
    r.querySelector("input").checked = !!st;
    r.querySelector(".stamp").innerHTML = stampHTML(st);
  });
  progress();
}

/* ---------- sync ---------- */
const syncEl = document.getElementById("sync");
function setStatus(ok){
  const n = Object.keys(pending).length;
  if (ok && !n) { syncEl.className = "sync"; syncEl.textContent = "Shared · synced " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
  else { syncEl.className = "sync bad"; syncEl.textContent = n ? `No signal — ${n} change${n>1?"s":""} will send when back online` : "No signal — showing last saved list"; }
}
let flushing = false;
async function flush(){
  if (flushing) return;
  flushing = true;
  try {
    for (const id of Object.keys(pending)) {
      const p = pending[id];
      const r = await fetch(API, { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({ ...p, id }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (pending[id] === p) delete pending[id];           // untouched since we sent it
      if (p.op === "check") server[id] = { by: p.by, at: p.at }; else delete server[id];
    }
    keep(K_PEND, pending); keep(K_CACHE, server);
  } catch(e) {
    keep(K_PEND, pending); flushing = false; setStatus(false); return false;
  }
  flushing = false;
  if (Object.keys(pending).length) return flush();          // user tapped again mid-send
  return true;
}
async function pull(){
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    server = (await r.json()).checks || {};
    keep(K_CACHE, server); setStatus(true); refresh();
  } catch(e) { setStatus(false); }
}
async function sync(){ if (await flush() !== false) await pull(); }

document.getElementById("panels").addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  if (e.target.checked) {
    if (!who) { e.target.checked = false; alert("Enter your initials at the top first so your check-off is stamped."); fw.focus(); return; }
    pending[id] = { op: "check", by: who, at: new Date().toISOString() };
  } else pending[id] = { op: "uncheck" };
  keep(K_PEND, pending); refresh(); flush().then(ok => { if (ok) setStatus(true); });
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.tab));
  window.scrollTo(0,0);
}));
document.getElementById("btn-reset").onclick = async () => {
  if (!confirm("Clear EVERY check-off for the whole crew, on every device? This can't be undone.")) return;
  try {
    const r = await fetch(API, { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({ op: "reset" }) });
    if (!r.ok) throw new Error();
    server = {}; pending = {}; keep(K_CACHE, server); keep(K_PEND, pending); refresh(); setStatus(true);
  } catch(e) { alert("Couldn't reach the server, so nothing was cleared. Try again when you have signal."); }
};
document.getElementById("btn-pdf").onclick = () => window.print();

const d = new Date(), pad = n => String(n).padStart(2,"0");
const todayISO = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
document.getElementById("today").textContent = d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
const fd = document.getElementById("f-date"), fc = document.getElementById("f-crew"), fw = document.getElementById("f-who");
fd.value = meta.date || todayISO; fc.value = meta.crew || ""; fw.value = who;
fd.oninput = () => { meta.date = fd.value; keep(K_META, meta); };
fc.oninput = () => { meta.crew = fc.value; keep(K_META, meta); };
fw.oninput = () => { who = fw.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4); fw.value = who; keep(K_WHO, who); };
/* ---------- weather: National Weather Service forecast + alerts for this phone's GPS position ---------- */
const K_WX = "skullshut_wx", K_POS = "skullshut_pos";
const wxEl = document.getElementById("wx");
let wx = load(K_WX, null), pos = load(K_POS, null), wxErr = "";
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? "just now" : m < 90 ? m + " min ago" : Math.round(m / 60) + " hr ago"; };

const RAIN_ALERT_IN = 0.5;   // flag any storm that adds up to at least this much rain (inches)
const isoHours = s => { const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?)?$/.exec(s || ""); return m ? (+m[1] || 0) * 24 + (+m[2] || 0) : 0; };
/* NWS gives rainfall (mm) in multi-hour blocks. Spread it by the hour, then find the wettest "storm"
   (wet hours joined when less than ~7 hours apart) and the total for each of the next 7 days. */
function rainSummary(grid){
  const q = grid && grid.properties && grid.properties.quantitativePrecipitation;
  if (!q || !q.values || !q.values.length) return null;
  const H = 3600000, hourly = new Map();
  for (const v of q.values) {
    if (v.value == null) continue;
    const parts = String(v.validTime).split("/"), t0 = Date.parse(parts[0]), n = isoHours(parts[1]);
    if (isNaN(t0) || !n) continue;
    for (let i = 0; i < n; i++) hourly.set(t0 + i * H, v.value / 25.4 / n);
  }
  if (!hourly.size) return null;
  const hrs = [...hourly.keys()].sort((a, b) => a - b);
  const runs = [];
  for (const h of hrs) {
    const v = hourly.get(h); if (v < 0.002) continue;
    const last = runs[runs.length - 1];
    if (last && h - last.end <= 7 * H) { last.end = h; last.inches += v; } else runs.push({ start: h, end: h, inches: v });
  }
  const storm = runs.reduce((a, b) => (!a || b.inches > a.inches ? b : a), null) || { inches: 0, start: hrs[0], end: hrs[0] };
  const days = {};
  for (const h of hrs) {
    const d = new Date(h), k = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    (days[k] = days[k] || { t: h, inches: 0 }).inches += hourly.get(h);
  }
  return { storm: { inches: storm.inches, start: storm.start, end: storm.end + H }, days: Object.values(days).slice(0, 7) };
}
const wd = t => new Date(t).toLocaleDateString([], { weekday: "short" });
const wdh = t => new Date(t).toLocaleString([], { weekday: "short", hour: "numeric" });
const inch = n => n < 0.005 ? "–" : n.toFixed(2) + '"';
function rainHTML(r){
  if (!r) return "";
  const s = r.storm, hit = s.inches >= RAIN_ALERT_IN;
  const banner = hit
    ? `<div class="wx-rain hit">⚠ HEAVY RAIN WATCH: about ${s.inches.toFixed(1)}" from ${esc(wdh(s.start))} to ${esc(wdh(s.end))}. Finish the list before then.</div>`
    : `<div class="wx-rain">${s.inches < 0.005 ? "No rain in the forecast." : "No storm of " + RAIN_ALERT_IN + '" or more in the forecast. Wettest stretch: ' + inch(s.inches) + " around " + esc(wd(s.start)) + "."}</div>`;
  return banner + `<div class="wx-days">${r.days.map(d => `<div class="${d.inches >= RAIN_ALERT_IN ? "hit" : ""}"><b>${esc(wd(d.t))}</b>${inch(d.inches)}</div>`).join("")}</div>`;
}

function wxRender(){
  let h;
  if (!wx) {
    h = `<div class="wx-head"><b>Weather</b><span>GPS forecast</span></div>
      <div class="wx-msg">${esc(wxErr || "Getting your location…")}</div>
      ${wxErr ? '<button class="wx-btn" id="wx-go">Use my location</button>' : ""}`;
  } else {
    h = `<div class="wx-head"><b>Forecast · ${esc(wx.place || "your location")}</b><span>${wxErr ? "no signal · " : ""}updated ${ago(wx.at)}</span></div>` +
      rainHTML(wx.rain) +
      wx.alerts.map(a => `<details class="wx-alert${/Severe|Extreme/.test(a.severity) ? " sev" : ""}"><summary>⚠ ${esc(a.event)}${a.ends ? " · until " + esc(a.ends) : ""}</summary><div class="d">${esc(a.headline)}\n\n${esc(a.description)}</div></details>`).join("") +
      wx.periods.map(p => `<details class="wx-p"><summary><span class="n">${esc(p.name)}</span><span class="t">${esc(p.temp)}°</span><span class="r">${p.pop == null ? "" : esc(p.pop) + "%"}</span><span class="s">${esc(p.short)}</span></summary><div class="d">${esc(p.detail)}</div></details>`).join("") +
      `<div class="wx-note">Rain totals are forecast model amounts (snow counts as its melted water), so they can be off. % = chance of rain/snow. Tap a line for details and wind. Source: National Weather Service, for your phone's position.</div>`;
  }
  wxEl.innerHTML = h;
  const go = document.getElementById("wx-go"); if (go) go.onclick = wxRefresh;
}
const getJSON = async u => { const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); };
const nowPos = () => new Promise((res, rej) => {
  if (!navigator.geolocation) return rej({ code: 0 });
  navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { timeout: 15000, maximumAge: 3600000 });
});
const fmtEnd = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); };
async function wxLoad(lat, lon){
  const ll = lat.toFixed(4) + "," + lon.toFixed(4);
  const pt = await getJSON("https://api.weather.gov/points/" + ll);
  const rl = pt.properties.relativeLocation && pt.properties.relativeLocation.properties;
  const [f, g, a] = await Promise.all([
    getJSON(pt.properties.forecast),
    pt.properties.forecastGridData ? getJSON(pt.properties.forecastGridData).catch(() => null) : null,
    getJSON("https://api.weather.gov/alerts/active?point=" + ll).catch(() => ({ features: [] }))
  ]);
  return {
    at: Date.now(), place: rl ? rl.city + ", " + rl.state : "", rain: rainSummary(g),
    periods: f.properties.periods.slice(0, 6).map(p => ({ name: p.name, temp: p.temperature, pop: p.probabilityOfPrecipitation ? p.probabilityOfPrecipitation.value : null, short: p.shortForecast, detail: p.detailedForecast + (p.windSpeed ? " Wind " + (p.windDirection || "") + " " + p.windSpeed + "." : "") })),
    alerts: (a.features || []).map(x => ({ event: x.properties.event, severity: x.properties.severity || "", headline: x.properties.headline || "", description: String(x.properties.description || "").slice(0, 1500), ends: fmtEnd(x.properties.ends || x.properties.expires) }))
  };
}
async function wxRefresh(){
  try {
    try { pos = await nowPos(); keep(K_POS, pos); }
    catch(e) { if (!pos) throw e; }                       // no fresh GPS fix: use the last one
    wx = await wxLoad(pos.lat, pos.lon); keep(K_WX, wx); wxErr = "";
  } catch(e) {
    wxErr = e && e.code === 1 ? "Location is blocked for this site. Allow location for this page in your browser settings, then tap the button."
          : e && e.code ? "Couldn't get a GPS position. Tap the button to try again."
          : "Couldn't load the forecast (no signal, or outside the US).";
  }
  wxRender();
}
wxRender(); wxRefresh();
setInterval(wxRefresh, 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!wx || Date.now() - wx.at > 10 * 60 * 1000)) wxRefresh(); });

build();
sync();
setInterval(sync, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
window.addEventListener("online", sync);
</script>
</body>
</html>
